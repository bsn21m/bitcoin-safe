name: Python Tests Matrix
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deterministic-build-compile-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Rebuild deterministic build requirements
        run: bash tools/deterministic-build/compile.sh

      - name: Fail if deterministic build files changed
        run: |
          set -euo pipefail
          # pip-compile embeds the Python version and the constraint-file
          # path in comment lines (starting with '#'), which can differ
          # across environments. Only fail when the actual pins and hashes
          # (non-comment content) change, or when build artifacts are left
          # behind as untracked files.
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "Running tools/deterministic-build/compile.sh left untracked files:"
            echo "$untracked"
            exit 1
          fi
          content_diff="$(git --no-pager diff \
            | grep -E '^[+-][^+-]' \
            | grep -vE '^[+-][[:space:]]*#' \
            | grep -vE '^[+-][[:space:]]*$' \
            || true)"
          if [ -n "$content_diff" ]; then
            echo "Running tools/deterministic-build/compile.sh produced non-comment changes:"
            git status --short
            git --no-pager diff
            exit 1
          fi

  linux-tests:
    strategy:
      matrix:
        backend: [fulcrum, cbf]
    uses: ./.github/workflows/python-tests.yml
    secrets: inherit
    with:
      os: ubuntu-22.04
      backend: ${{ matrix.backend }}

  windows-tests:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pytest-win') }}
    strategy:
      matrix:
        backend: [cbf]
    uses: ./.github/workflows/python-tests.yml
    secrets: inherit
    with:
      os: windows-latest
      backend: ${{ matrix.backend }}

  macos-tests:
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pytest-mac') }}
    strategy:
      matrix:
        backend: [cbf]
    uses: ./.github/workflows/python-tests.yml
    secrets: inherit
    with:
      os: macos-latest
      backend: ${{ matrix.backend }}
